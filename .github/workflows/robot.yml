name: Robot de noticias APPA

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-appa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar noticias y videos reales
        run: node robot/actualizar.mjs

      - name: Guardar si hay novedades
        run: |
          if git diff --quiet noticias.json; then
            echo "Nada nuevo."
            exit 0
          fi
          git config user.name "robot-appa"
          git config user.email "robot-appa@users.noreply.github.com"
          git add noticias.json
          git commit -m "Robot: noticias APPA $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git push
